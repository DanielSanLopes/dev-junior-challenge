# Ponto de partida OPCIONAL. Usar Docker é um desejável, não uma obrigação.
# O mock-service e um banco já estão prontos. Se quiser, complete com os SEUS
# serviços: "api" (NestJS) e "web" (React).

services:
  mock-service:
    build: ./mock-service
    ports:
      - "4000:4000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
      POSTGRES_DB: checkin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # ------------------------------------------------------------------
  # EXEMPLO (descomente e ajuste, se for usar Docker).
  # A URL do serviço externo, a partir da sua api, é http://mock-service:4000
  # (nome do serviço na rede do compose).
  
  api:
    build: ./api
    environment:
      CADASTRO_URL: http://mock-service:4000
      CORS_ORIGIN: http://localhost:5173
      LOCAL_CORS_ORIGIN:http: //localhost:5173
      DATABASE_URL: postgres://desafio:desafio@db:5432/checkin
      PROD: 1
    ports:
      - "3000:3000"
    depends_on:
      - mock-service
  
  front:
    build: ./front
    environment:
      VITE_API_URL: http://localhost:3000/
      VITE_LOCALHOST_URL: http://localhost:3000/
      VITE_PROD: 1
    ports:
      - "5173:5173"
    depends_on:
      - api
  # ------------------------------------------------------------------

volumes:
  db_data:
